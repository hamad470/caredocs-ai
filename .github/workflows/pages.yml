name: Live demo (GitHub Pages)

# Builds the "Ask the records" demo from the synthetic cohort and publishes it.
# One-time setup: repo Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Generate the synthetic cohort (seed 4242)
        run: python synthetic_cohort.py --yes
      - name: Export records with line numbers
        run: python build_rag_demo.py --reference
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the browser engine against the Python reference
        working-directory: site
        run: node --test test/retrieval.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
