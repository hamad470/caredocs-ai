name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AI_PROVIDER: template     # offline path; no API key needed in CI
      SECRET_KEY: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Build synthetic cohort and retrieval indexes
        run: python setup_project.py --skip-train
      - name: Core test suite
        run: python test_project.py
      - name: Assistant and retrieval tests
        run: python test_chat_rag.py
      - name: Build the live demo data
        run: python build_rag_demo.py --reference
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Live demo engine tests (JS vs Python parity, citations, verifier)
        working-directory: site
        run: node --test test/retrieval.test.mjs
